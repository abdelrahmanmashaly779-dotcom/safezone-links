<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a9d2f" id="themeColor">
<title>Safe Zone</title>
<link rel="icon" href="data:," id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Cairo';--bg:#2a9d2f;--bg2:#238a28;--btn:#ffffff;--btn2:#e8f6e9;--btnText:#1f8f26;--text:#ffffff;
  --r:14px;--bangle:135deg;--btnBorder:#ffffff;--bw:0px;--sh:0 4px 14px rgba(0,0,0,.16);
  --wh:800;--wb:600;--logoBg:#ffffff;--mh:68px;--th:56px;--fs:16px;--gap:12px;
  --logo:112px;--logoR:50%;--ring:0px;--ss:30px;
}
html,body{min-height:100%}
body{
  font-family:var(--font),'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100dvh;
}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* طبقات الخلفية */
.bg,.ov,.fx{position:fixed;inset:0;pointer-events:none}
.bg{z-index:-3;background-position:center;background-repeat:no-repeat}
.ov{z-index:-2}
.fx{z-index:-1;overflow:hidden}
.bg.shift{background-size:300% 300%;animation:bgShift 14s ease infinite}
.bg.zoom{animation:kb 22s ease-in-out infinite alternate}
.fx span{position:absolute;bottom:-90px;border-radius:50%;background:#fff;animation:rise linear infinite}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes rise{to{transform:translateY(-118vh)}}

.wrap{
  position:relative;max-width:480px;margin:0 auto;
  padding:max(28px,env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}

/* شريط الإعلان */
.ann{display:block;text-align:center;font-weight:700;font-size:14px;line-height:1.6;
  background:rgba(0,0,0,.24);border-radius:var(--r);padding:10px 14px;color:#fff}

/* الهيدر */
.head{text-align:center;padding:8px 0 4px}
.logo{
  width:var(--logo);height:var(--logo);border-radius:var(--logoR);background:var(--logoBg);object-fit:cover;
  display:block;margin:0 auto;box-shadow:0 6px 22px rgba(0,0,0,.18),0 0 0 var(--ring) var(--text);
}
.logo.nobg{background:transparent;box-shadow:none;border-radius:0;object-fit:contain;width:auto;max-width:100%;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
.logo-pulse{animation:lPulse 2.4s ease-in-out infinite}
.logo-glow{animation:lGlowF 2.4s ease-in-out infinite}
.logo-rainbow{animation:lRainbow 3s linear infinite}
.logo-heartbeat{animation:hlHeart 1.6s ease-in-out infinite}
.logo-shake{animation:hlShake 3s ease-in-out infinite}
.logo-wiggle{animation:hlWiggle 2.4s ease-in-out infinite}
.logo-bounce{animation:hlBounce 2.4s ease-in-out infinite}
.logo-float{animation:hlFloat 3s ease-in-out infinite}
.logo-flash{animation:hlFlash 1.6s ease-in-out infinite}
.logo-swing{animation:hlSwing 3s ease-in-out infinite;transform-origin:top center}
.logo-rubber{animation:hlRubber 2.6s ease-in-out infinite}
.logo-tada{animation:hlTada 2.8s ease-in-out infinite}
.logo-jello{animation:hlJello 2.8s ease-in-out infinite}
@keyframes lPulse{50%{transform:scale(1.07)}}
@keyframes lGlowF{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 18px rgba(255,255,255,.95))}}
@keyframes lRainbow{0%,100%{filter:drop-shadow(0 0 8px #ff3b30)}25%{filter:drop-shadow(0 0 8px #ffcc00)}50%{filter:drop-shadow(0 0 8px #34c759)}75%{filter:drop-shadow(0 0 8px #0a84ff)}}
.head h1{font-size:27px;font-weight:var(--wh);margin-top:14px;letter-spacing:.2px}
.head p{font-size:16px;font-weight:var(--wb);line-height:1.7;margin:6px auto 0;max-width:340px;opacity:.96;white-space:pre-line}

/* السوشيال */
.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--sg,20px);margin-top:18px;transform:translate(var(--sx,0px),var(--sy,0px))}
.socials.bottom{margin-top:26px}
.socials a{display:block;width:var(--ss);height:var(--ss);transition:transform .15s}
.socials a:hover{transform:scale(1.12)}
.socials svg{width:100%;height:100%;display:block}
body[data-ss=circle] .socials a,body[data-ss=ring] .socials a{
  width:calc(var(--ss)*1.6);height:calc(var(--ss)*1.6);padding:calc(var(--ss)*.34);border-radius:50%}
body[data-ss=circle] .socials a{background:var(--btn);color:var(--btnText)}
body[data-ss=ring] .socials a{border:2px solid currentColor}

/* العداد */
.cd{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:16px;text-align:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff}
.cd h2{font-size:17px;font-weight:var(--wh);margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.u{background:rgba(0,0,0,.22);border-radius:12px;padding:9px 0 7px}
.u b{display:block;font-size:26px;font-weight:var(--wh);line-height:1.2;font-variant-numeric:tabular-nums}
.u small{font-size:12px;font-weight:600;opacity:.92}
.cd .go{display:block;margin-top:12px;background:#fff;color:#1f7a24;border-radius:var(--r);padding:11px;font-weight:800}
.cd .ended{font-weight:700;padding:6px 0}

.hd{font-weight:800;font-size:15px;text-align:center;opacity:.95;margin-top:8px}

/* الكروت */
.links{display:flex;flex-direction:column;gap:var(--gap)}
.card{
  position:relative;direction:ltr;display:grid;grid-template-columns:var(--th) 1fr 24px;align-items:center;gap:10px;
  background:var(--btn);color:var(--btnText);
  border:var(--bw) solid var(--btnBorder);border-radius:var(--r);padding:10px;min-height:var(--mh);
  box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,filter .18s;
}
body[data-bs=gradient] .card{background:linear-gradient(var(--bangle),var(--btn),var(--btn2))}
body[data-bs=outline] .card{background:transparent;color:var(--text);border:max(var(--bw),2px) solid var(--btnBorder)}
body[data-bs=glass] .card{background:rgba(255,255,255,.16);color:var(--text);border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body[data-hv=lift] .card:hover{transform:translateY(-3px)}
body[data-hv=grow] .card:hover{transform:scale(1.03)}
body[data-hv=bright] .card:hover{filter:brightness(1.08) saturate(1.1)}
.card:active{transform:scale(.985)}
.thumb{width:var(--th);height:var(--th);border-radius:min(calc(var(--r) - 4px),50%);object-fit:cover;display:block}
.thumb.ph{background:transparent}
.ctext{direction:rtl;text-align:center;display:flex;flex-direction:column;gap:2px;padding:0 2px}
.ctext b{font-size:var(--fs);font-weight:var(--wh);line-height:1.45}
.ctext small{font-size:13px;font-weight:var(--wb);opacity:.75;line-height:1.4}
.arrow{width:20px;height:20px;opacity:.45}
.arrow svg{width:100%;height:100%;display:block}
.badge{position:absolute;top:-9px;inset-inline-start:14px;direction:rtl;background:#e5322d;color:#fff;font-style:normal;
  font-weight:800;font-size:12px;padding:2px 10px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* حركة لفت الانتباه */
.hl-pulse{animation:hlPulse 1.9s ease-out infinite}
.hl-shake{animation:hlShake 3s ease-in-out infinite}
.hl-glow{animation:hlGlow 2s ease-in-out infinite}
.hl-bounce{animation:hlBounce 2.4s ease-in-out infinite}
@keyframes hlPulse{0%{box-shadow:var(--sh),0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:var(--sh),0 0 0 16px rgba(255,255,255,0)}}
@keyframes hlShake{0%,80%,100%{transform:none}84%{transform:translateX(-5px)}88%{transform:translateX(5px)}92%{transform:translateX(-3px)}96%{transform:translateX(3px)}}
@keyframes hlGlow{0%,100%{box-shadow:var(--sh)}50%{box-shadow:var(--sh),0 0 28px 4px rgba(255,255,255,.9)}}
@keyframes hlBounce{0%,70%,100%{transform:none}78%{transform:translateY(-8px)}86%{transform:translateY(0)}92%{transform:translateY(-4px)}}

.hl-heartbeat{animation:hlHeart 1.6s ease-in-out infinite}
.hl-wiggle{animation:hlWiggle 2.4s ease-in-out infinite}
.hl-float{animation:hlFloat 2.6s ease-in-out infinite}
.hl-flash{animation:hlFlash 1.6s ease-in-out infinite}
.hl-swing{animation:hlSwing 3s ease-in-out infinite;transform-origin:top center}
.hl-rubber{animation:hlRubber 2.6s ease-in-out infinite}
.hl-tada{animation:hlTada 2.8s ease-in-out infinite}
.hl-jello{animation:hlJello 2.8s ease-in-out infinite}
.hl-rainbow{animation:hlRainbow 3s linear infinite}
.hl-shine::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
  background-size:250% 100%;background-repeat:no-repeat;background-position:180% 0;animation:hlShine 2.4s ease-in-out infinite}
@keyframes hlHeart{0%,100%{transform:scale(1)}14%{transform:scale(1.05)}28%{transform:scale(1)}42%{transform:scale(1.05)}70%{transform:scale(1)}}
@keyframes hlWiggle{0%,70%,100%{transform:none}75%{transform:rotate(-2.5deg)}82%{transform:rotate(2.5deg)}89%{transform:rotate(-1.5deg)}95%{transform:rotate(1.5deg)}}
@keyframes hlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hlFlash{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes hlSwing{0%,75%,100%{transform:none}80%{transform:rotate(3deg)}86%{transform:rotate(-2.5deg)}92%{transform:rotate(1.5deg)}96%{transform:rotate(-1deg)}}
@keyframes hlRubber{0%,70%,100%{transform:scale(1)}76%{transform:scale(1.08,.92)}82%{transform:scale(.94,1.06)}88%{transform:scale(1.04,.97)}94%{transform:scale(1)}}
@keyframes hlTada{0%,70%,100%{transform:scale(1) rotate(0)}74%{transform:scale(.96) rotate(-2deg)}78%,86%{transform:scale(1.06) rotate(2.5deg)}82%,90%{transform:scale(1.06) rotate(-2.5deg)}94%{transform:scale(1) rotate(0)}}
@keyframes hlJello{0%,70%,100%{transform:none}76%{transform:skewX(-8deg) skewY(-4deg)}82%{transform:skewX(6deg) skewY(3deg)}88%{transform:skewX(-3deg) skewY(-1.5deg)}94%{transform:skewX(1.5deg)}}
@keyframes hlRainbow{0%,100%{box-shadow:var(--sh),0 0 0 3px #ff3b30}25%{box-shadow:var(--sh),0 0 0 3px #ffcc00}50%{box-shadow:var(--sh),0 0 0 3px #34c759}75%{box-shadow:var(--sh),0 0 0 3px #0a84ff}}
@keyframes hlShine{0%{background-position:180% 0}60%,100%{background-position:-80% 0}}

/* حركة الدخول */
.cw{animation-duration:.6s;animation-fill-mode:both;animation-delay:calc(var(--i,0)*90ms)}
body[data-en=fade] .cw{animation-name:enFade}
body[data-en=up] .cw{animation-name:enUp}
body[data-en=slide] .cw{animation-name:enSlide}
body[data-en=zoom] .cw{animation-name:enZoom}
@keyframes enFade{from{opacity:0}to{opacity:1}}
@keyframes enUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes enSlide{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
@keyframes enZoom{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}

/* أوراق الشجر وتأثيرات الخلفية الإضافية */
.fxl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.fxl>*{position:absolute}
.lf{top:-60px;animation:lfFall linear infinite}
.lf svg{display:block;width:100%;height:100%;animation:lfSway ease-in-out infinite alternate}
.pf{top:-30px;border-radius:50%;background:#fff;animation:pfFall linear infinite}
.rn{top:-40px;width:1.5px;background:linear-gradient(transparent,rgba(255,255,255,.75));animation:rnFall linear infinite}
.st{border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.8);animation:stTw ease-in-out infinite}
.ff{border-radius:50%;background:radial-gradient(circle,#fffbb0 0%,rgba(255,240,120,.55) 40%,transparent 70%);animation:ffFly ease-in-out infinite,ffBlink ease-in-out infinite}
.cf{top:-20px;border-radius:2px;animation:cfFall linear infinite}
.au{border-radius:50%;filter:blur(60px);mix-blend-mode:screen;animation:auMove ease-in-out infinite alternate}
.wv{left:0;width:100%;height:90px;background-repeat:repeat-x;background-size:1200px 100%;animation:wvMove linear infinite}
@keyframes lfFall{from{transform:translate3d(0,-8vh,0)}to{transform:translate3d(var(--dx,0px),112vh,0)}}
@keyframes lfSway{from{transform:translateX(-26px) rotate(-35deg)}to{transform:translateX(26px) rotate(40deg)}}
@keyframes pfFall{from{transform:translate3d(0,-6vh,0)}to{transform:translate3d(var(--dx,20px),110vh,0)}}
@keyframes rnFall{from{transform:translate3d(0,-10vh,0) rotate(12deg)}to{transform:translate3d(-30px,112vh,0) rotate(12deg)}}
@keyframes stTw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ffFly{0%,100%{transform:translate(0,0)}25%{transform:translate(var(--x1),var(--y1))}50%{transform:translate(var(--x2),var(--y2))}75%{transform:translate(var(--x3),var(--y3))}}
@keyframes ffBlink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes cfFall{from{transform:translate3d(0,-6vh,0) rotate(0)}to{transform:translate3d(var(--dx,30px),110vh,0) rotate(720deg)}}
@keyframes auMove{from{transform:translate(-8vw,-4vh) scale(1)}to{transform:translate(10vw,8vh) scale(1.25)}}
@keyframes wvMove{from{background-position-x:0}to{background-position-x:1200px}}
@media (prefers-reduced-motion:reduce){.fxl{display:none}}
.gline{display:none;position:fixed;left:0;right:0;height:0;border-top:2px dashed rgba(255,60,60,.95);z-index:50;pointer-events:none}
.gline::after{content:'الأرض (للمعاينة فقط)';position:absolute;top:2px;inset-inline-start:6px;font:700 11px Cairo,sans-serif;color:#fff;background:rgba(220,40,40,.9);padding:1px 8px;border-radius:99px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="ov" id="ov"></div>
<div class="fx" id="fx"></div>
<div class="fxl" id="lv"></div>
<div class="fxl" id="fx2"></div>
<div class="gline" id="gline"></div>
<main class="wrap" id="app"></main>

<script>
/* ---------- الإعدادات الافتراضية (لو مفيش config.json) ---------- */
const DEFAULT_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="100" fill="#fff"/>' +
  '<circle cx="100" cy="100" r="82" fill="none" stroke="#2a9d2f" stroke-width="3"/>' +
  '<text x="100" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="40" fill="#1fa84a">Safe</text>' +
  '<text x="100" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="40" fill="#1fa84a">Zone</text></svg>');

const THEME_DEFAULT = {
  bg: '#2a9d2f', bg2: '#238a28', text: '#ffffff', font: 'Cairo',
  bgType: 'gradient', bgAngle: '180', bgAnim: 'none', bgImage: '', bgOverlayColor: '#000000', bgOverlay: '35', bgBlur: '0',
  btnStyle: 'solid', btn: '#ffffff', btn2: '#e8f6e9', btnAngle: '135', btnText: '#1f8f26', btnBorder: '#ffffff', btnBorderW: '0',
  radius: '14', btnSize: 'md', btnGap: '12',
  btnShadow: 'soft', btnShadowColor: '#000000', btnHover: 'lift', btnEnter: 'fade', btnHighlight: 'pulse',
  logoShape: 'circle', logoSize: '112', logoRing: '0', logoAnim: 'none', logoBg: 'white', logoBgColor: '#ffffff',
  socialStyle: 'plain', socialSize: '30', socialPos: 'bottom',
  wHead: '800', wBody: '600', fontName: 'DIN Next Arabic', fontFiles: [],
  leavesOn: false, leavesOpacity: '70', leavesSpeed: '5', leavesCount: '22', leavesSize: '26', leavesPalette: 'green',
  leavesGround: true, leavesGroundY: '90', leavesGroundDepth: '6', leavesRest: '6',
  bgFx: 'none', fxOpacity: '60', fxSpeed: '5', socialX: '0', socialY: '0', socialGap: '20'
};

const DEFAULT = {
  brand: { name: 'Safezonestore', tagline: 'المنتجات المعلن عنها موجودة\nهنا... في السيف زوون', logo: DEFAULT_LOGO },
  theme: THEME_DEFAULT,
  socials: [
    { type: 'tiktok', url: '' },
    { type: 'instagram', url: '' },
    { type: 'whatsapp', url: '' },
    { type: 'facebook', url: '' }
  ],
  announcement: { enabled: false, text: '🔥 خصم خاص لفترة محدودة على كل المنتجات', url: '' },
  countdown: { enabled: false, title: 'العرض بينتهي خلال', end: '', buttonText: 'اطلب دلوقتي', url: 'https://safe-zone.store', hideWhenEnded: true, endedText: 'العرض انتهى' },
  links: [
    { id: 'a1', type: 'link', enabled: true, title: 'للطلب من مصر (متجرنا سيف زوون)', subtitle: '', url: 'https://safe-zone.store', image: DEFAULT_LOGO, badge: '', highlight: false, start: '', end: '' },
    { id: 'a2', type: 'link', enabled: true, title: 'لطلب أرجيفيت فوكس خارج مصر (دول الخليج وغيرها)', subtitle: '', url: '', image: '', badge: '', highlight: false, start: '', end: '' }
  ],
  pixels: { meta: '', tiktok: '' },
  analytics: { enabled: false, url: '', key: '' }
};

function norm(c) {
  c = c || {};
  const d = JSON.parse(JSON.stringify(DEFAULT));
  return {
    brand: { ...d.brand, ...c.brand }, theme: { ...d.theme, ...c.theme },
    announcement: { ...d.announcement, ...c.announcement }, countdown: { ...d.countdown, ...c.countdown },
    pixels: { ...d.pixels, ...c.pixels },
    analytics: { ...d.analytics, ...c.analytics },
    socials: Array.isArray(c.socials) ? c.socials : d.socials,
    links: Array.isArray(c.links) ? c.links : d.links
  };
}

/* ---------- أيقونات ---------- */
const S = (inner, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
const PHONE = 'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z';
const ICON = {
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
  instagram: S('<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>'),

  } else {
    bg.style.background = `linear-gradient(${angle}deg,${vars['--bg']},${vars['--bg2']})`;
  }
  if (anim === 'bubbles') {
    if (!fx.children.length) {
      for (let i = 0; i < 16; i++) {
        const sz = 8 + Math.random() * 46, s = h('span');
        s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;animation-duration:${9 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s;opacity:${.08 + Math.random() * .16}`;
        fx.append(s);
      }
    }
  } else fx.innerHTML = '';
  buildLeaves(T); buildFx(T);
  return T;
}

/* ---------- الرسم ---------- */
let timer = null;
function pad(n) { return String(n).padStart(2, '0'); }

function renderCountdown(c) {
  if (!c.enabled || !c.end) return null;
  const end = new Date(c.end).getTime();
  if (isNaN(end)) return null;
  if (end <= Date.now() && c.hideWhenEnded) return null;

  const nums = {}, units = h('div', { class: 'units' });
  [['d', 'يوم'], ['h', 'ساعة'], ['m', 'دقيقة'], ['s', 'ثانية']].forEach(([k, label]) => {
    nums[k] = h('b', {}, '00');
    units.append(h('div', { class: 'u' }, nums[k], h('small', {}, label)));
  });
  const box = h('section', { class: 'cd cw' },
    c.title ? h('h2', {}, c.title) : null, units,
    (c.buttonText && isReal(c.url)) ? h('a', { class: 'go', href: safeUrl(c.url), target: '_blank', rel: 'noopener noreferrer' }, c.buttonText) : null);
  const go = box.querySelector('.go'); if (go) go.addEventListener('click', e => e.isTrusted && track('countdown', 'countdown'));

  const tick = () => {
    const left = Math.max(0, end - Date.now());
    if (left === 0) {
      clearInterval(timer);
      if (c.hideWhenEnded) box.remove(); else { units.replaceWith(h('div', { class: 'ended' }, c.endedText || 'العرض انتهى')); if (go) go.remove(); }
      return;
    }
    const s = Math.floor(left / 1000);
    nums.d.textContent = pad(Math.floor(s / 86400));
    nums.h.textContent = pad(Math.floor(s % 86400 / 3600));
    nums.m.textContent = pad(Math.floor(s % 3600 / 60));
    nums.s.textContent = pad(s % 60);
  };
  tick(); timer = setInterval(tick, 1000);
  return box;
}

function visible(l) {
  if (l.enabled === false) return false;
  if (l.type !== 'heading' && !isReal(l.url)) return false;
  const now = Date.now();
  if (l.start) { const t = new Date(l.start).getTime(); if (!isNaN(t) && now < t) return false; }
  if (l.end) { const t = new Date(l.end).getTime(); if (!isNaN(t) && now > t) return false; }
  return true;
}

function render(cfg) {
  clearInterval(timer);
  const c = norm(cfg);
  const T = applyTheme(c.theme);
  document.title = c.brand.name || 'Safe Zone';
  const logo = safeImg(c.brand.logo);
  if (logo) document.getElementById('favicon').setAttribute('href', logo);

  const app = document.getElementById('app');
  app.innerHTML = '';

  if (c.announcement.enabled && c.announcement.text) {
    const a = c.announcement;
    const linked = isReal(a.url);
    const el = linked ? h('a', { class: 'ann', href: safeUrl(a.url), target: '_blank', rel: 'noopener noreferrer' }, a.text) : h('div', { class: 'ann' }, a.text);
    if (linked) el.addEventListener('click', e => e.isTrusted && track('announcement', 'announcement'));
    app.append(el);
  }

  const LOGO_ANIMS = ['pulse', 'heartbeat', 'shake', 'wiggle', 'bounce', 'float', 'glow', 'flash', 'swing', 'rubber', 'tada', 'jello', 'rainbow'];
  const logoAnim = PICK(T.logoAnim, LOGO_ANIMS, '');
  const nobg = T.logoBg === 'none';
  const socials = c.socials.filter(s => s && s.url && ICON[s.type] && isReal(s.url));
  const socialPos = T.socialPos === 'top' ? 'top' : 'bottom';
  const socialNav = socials.length ? h('nav', { class: 'socials ' + socialPos, 'aria-label': 'social' },
    socials.map(s => {
      const a = h('a', { href: safeUrl(s.url), target: '_blank', rel: 'noopener noreferrer', 'aria-label': s.type, html: ICON[s.type] });
      a.addEventListener('click', e => e.isTrusted && track('social_' + s.type, 'social_' + s.type));
      return a;
    })) : null;
  app.append(h('header', { class: 'head' },
    logo ? h('img', { class: 'logo' + (nobg ? ' nobg' : '') + (logoAnim ? ' logo-' + logoAnim : ''), src: logo, alt: c.brand.name || '' }) : null,
    c.brand.name ? h('h1', {}, c.brand.name) : null,
    c.brand.tagline ? h('p', {}, c.brand.tagline) : null,
    socialPos === 'top' ? socialNav : null));

  const cd = renderCountdown(c.countdown);
  if (cd) app.append(cd);

  const ANIMS = ['pulse', 'heartbeat', 'shake', 'wiggle', 'bounce', 'float', 'glow', 'flash', 'shine', 'swing', 'rubber', 'tada', 'jello', 'rainbow'];
  const hl = PICK(T.btnHighlight, ANIMS, 'pulse');
  const list = h('div', { class: 'links' });
  let idx = 0;
  c.links.filter(visible).forEach(l => {
    if (l.type === 'heading') { if (l.title) list.append(h('div', { class: 'hd cw', style: `--i:${idx++}` }, l.title)); return; }
    const img = safeImg(l.image);
    let an = l.anim || (l.highlight ? 'default' : '');
    if (an === 'default') an = hl;
    if (!ANIMS.includes(an)) an = '';
    const card = h('a', { class: 'card' + (an ? ' hl-' + an : ''), href: safeUrl(l.url), target: '_blank', rel: 'noopener noreferrer' },
      img ? h('img', { class: 'thumb', src: img, alt: '', loading: 'lazy' }) : h('span', { class: 'thumb ph' }),
      h('span', { class: 'ctext' }, h('b', {}, l.title || ''), l.subtitle ? h('small', {}, l.subtitle) : null),
      h('span', { class: 'arrow', html: ICON.arrow }),
      l.badge ? h('em', { class: 'badge' }, l.badge) : null);
    card.addEventListener('click', e => e.isTrusted && track(l.title || 'link', l.id || l.title));
    list.append(h('div', { class: 'cw', style: `--i:${idx++}` }, card));
  });
  app.append(list);
  if (socialPos === 'bottom' && socialNav) app.append(socialNav);

  loadPixels(c.pixels);
  setupAnalytics(c.analytics);
}

/* ---------- التشغيل ---------- */
async function boot() {
  if (PREVIEW) {
    window.addEventListener('message', e => { if (e.data && e.data.type === 'sz-config') render(e.data.config); });
    render(DEFAULT);
    parent.postMessage({ type: 'sz-ready' }, '*');
    return;
  }
  let cfg = DEFAULT;
  try {
    const r = await fetch('config.json?v=' + Date.now(), { cache: 'no-store' });
    if (r.ok) cfg = await r.json();
  } catch (e) { /* يفضل على الإعدادات الافتراضية */ }
  render(cfg);
}
boot();
</script>
